<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Quality Report — $source_name</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.6;
    background: #f7f8fa;
    color: #1a1a2e;
    padding: 48px 24px;
  }

  .wrap { max-width: 860px; margin: 0 auto; }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 2px solid #e2e5ea;
  }
  .topbar-left h1 {
    font-size: 20px;
    font-weight: 600;
    color: #0f172a;
    margin-bottom: 4px;
  }
  .topbar-left p {
    font-size: 12px;
    color: #64748b;
    font-family: 'JetBrains Mono', monospace;
  }
  .score-block {
    text-align: right;
  }
  .score-number {
    font-size: 40px;
    font-weight: 600;
    color: $score_color;
    line-height: 1;
    font-family: 'JetBrains Mono', monospace;
  }
  .score-label {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 2px;
  }

  /* Summary strip */
  .summary {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
  }
  .summary-pill {
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pill-pass { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
  .pill-warn { background:#fffbeb; color:#92400e; border:1px solid #fcd34d; }
  .pill-fail { background:#fef2f2; color:#991b1b; border:1px solid #fca5a5; }
  .pill-num  { font-size:16px; font-weight:600; font-family:'JetBrains Mono',monospace; }

  /* Dataset meta */
  .meta {
    background: white;
    border: 1px solid #e2e5ea;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #475569;
    display: flex;
    gap: 32px;
  }
  .meta span { color: #0f172a; font-weight: 500; }

  /* Check rows */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: #94a3b8;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .check-row {
    background: white;
    border: 1px solid #e2e5ea;
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 10px;
  }
  .check-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .check-name {
    font-weight: 600;
    font-size: 13px;
    color: #0f172a;
  }
  .check-msg {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 0;
  }

  /* Detail tables */
  .detail-wrap {
    margin-top: 14px;
    overflow-x: auto;
    border-top: 1px solid #f1f5f9;
    padding-top: 12px;
  }
  .detail-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11.5px;
    font-family: 'JetBrains Mono', monospace;
  }
  .detail-table th {
    text-align: left;
    padding: 6px 12px;
    font-size: 10.5px;
    font-weight: 600;
    color: #64748b;
    border-bottom: 1px solid #e2e5ea;
    white-space: nowrap;
  }
  .table-note {
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
  }
  .detail-table td {
    padding: 6px 12px;
    color: #334155;
    border-bottom: 1px solid #f8fafc;
    white-space: nowrap;
  }
  .detail-table tr:last-child td { border-bottom: none; }
  .detail-table tr:hover td { background: #f8fafc; }

  /* Footer */
  .footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #e2e5ea;
    font-size: 11px;
    color: #94a3b8;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="topbar-left">
      <h1>Data Quality Report</h1>
      <p>$source_name &nbsp;·&nbsp; $generated_at</p>
    </div>
    <div class="score-block">
      <div class="score-number">$score%</div>
      <div class="score-label">checks passed</div>
    </div>
  </div>

  <div class="summary">
    <div class="summary-pill pill-pass"><span class="pill-num">$passed</span> passed</div>
    <div class="summary-pill pill-warn"><span class="pill-num">$warned</span> warnings</div>
    <div class="summary-pill pill-fail"><span class="pill-num">$failed</span> failed</div>
  </div>

  <div class="meta">
    <div>Rows &nbsp;<span>$row_count</span></div>
    <div>Columns &nbsp;<span>$column_count</span></div>
    <div>Checks run &nbsp;<span>$check_count</span></div>
    <div>Date range &nbsp;<span>$years</span></div>
  </div>

  <div class="section-label">Check Results</div>

  $checks_html

  <div class="footer">
    <span>Sales Data Quality Auditor</span>
    <span>github.com/AnkitDutta</span>
  </div>

</div>
</body>
</html>
